<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174b8b">
  <title>Encuestas Escuela Oriente - Segundo Ciclo</title>
  <style>
    :root { --blue:#1f5da8; --blue-dark:#123c72; --gold:#ffcc22; --brown:#6c3516; --ink:#203047; --muted:#64748b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 16px; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:linear-gradient(145deg,#eaf3ff 0%,#f8fbff 55%,#fff7df 100%); }
    .card { width:min(100%,480px); padding:34px 28px 30px; text-align:center; background:rgba(255,255,255,.97); border:2px solid var(--gold); border-radius:24px; box-shadow:0 18px 48px rgba(18,60,114,.15); }
    .logo { display:block; width:min(72%,220px); height:auto; max-height:300px; object-fit:contain; margin:0 auto 20px; }
    .eyebrow { margin:0 0 8px; color:var(--brown); font-size:.82rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; color:var(--blue-dark); font-size:clamp(1.8rem,6vw,2.35rem); line-height:1.1; }
    .intro { margin:14px auto 26px; max-width:330px; color:var(--muted); font-size:1rem; line-height:1.55; }
    .cycle { margin:0 0 12px; color:var(--blue-dark); font-size:1.1rem; font-weight:700; }
    .button { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:58px; padding:15px 20px; border-radius:13px; background:var(--blue); color:white; font-size:1.05rem; font-weight:700; text-decoration:none; box-shadow:0 5px 0 var(--blue-dark); transition:transform .15s ease,background .15s ease; }
    .button:hover { background:var(--blue-dark); transform:translateY(-2px); }
    .button:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }
    .note { margin:22px 0 0; color:#7b8797; font-size:.82rem; }
    footer { margin-top:25px; color:var(--brown); font-size:.82rem; font-weight:700; }
    @media(max-width:360px) { .card { padding:26px 20px; } }
  </style>
</head>
